name: Check LEMD Weather

on:
  repository_dispatch:
    types: [trigger_from_cron]
  workflow_dispatch: # Позволяет запускать вручную кнопку "Run workflow" в интерфейсе GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: python bot.py
