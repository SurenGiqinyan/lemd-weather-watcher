name: Check LEMD Weather

on:
  repository_dispatch:
    types: [trigger_from_cron]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # Загружаем сохраненную с прошлого раза температуру (если она есть)
      - name: Restore last temperature cache
        uses: actions/cache@v4
        with:
          path: last_temp.txt
          key: weather-cache-${{ github.run_id }}
          restore-keys: |
            weather-cache-

      - name: Run script
        run: python bot.py
